name: Groma PR comparison

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  compare:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the PR comparison base
        id: commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "from=$(git merge-base "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
      - uses: MrLesk/groma.md-action@main
        id: map
        with:
          from: ${{ steps.commits.outputs.from }}
          revision: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: groma-comparison
          path: ${{ steps.map.outputs.output }}
          retention-days: 1

  publish:
    needs: compare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    # All PRs share one Pages site. Serialize publication and retain every preview.
    concurrency:
      group: groma-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: groma-comparison
          path: comparison
      - uses: MrLesk/groma.md-action/publish@main
        id: preview
        with:
          directory: comparison
          token: ${{ github.token }}
