name: Publish Groma PR comparison
description: Retain a public PR comparison on dedicated GitHub Pages and update its review comment.
inputs:
  directory:
    description: Downloaded website root from the comparison build.
    required: true
  theme:
    description: Theme used by the build Action.
    default: auto
  token:
    description: GitHub token with contents and pull-requests write permissions.
    required: true
outputs:
  url:
    description: Published comparison URL (empty for an outdated build).
    value: ${{ steps.comment.outputs.url }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Store this PR preview
      id: store
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GROMA_DIRECTORY: ${{ inputs.directory }}
        GROMA_THEME: ${{ inputs.theme }}
      run: node "$GITHUB_ACTION_PATH/publish.mjs" store
    - uses: actions/upload-pages-artifact@v4
      if: steps.store.outputs.ready == 'true'
      with:
        path: ${{ steps.store.outputs.site }}
    - uses: actions/deploy-pages@v4
      if: steps.store.outputs.ready == 'true'
      id: deploy
    - name: Update comparison comment
      if: steps.store.outputs.ready == 'true'
      id: comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GROMA_DIRECTORY: ${{ inputs.directory }}
        GROMA_THEME: ${{ inputs.theme }}
        GROMA_PAGE_URL: ${{ steps.deploy.outputs.page_url }}
      run: node "$GITHUB_ACTION_PATH/publish.mjs" comment
